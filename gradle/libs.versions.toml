[versions]
# Language / toolchain
kotlin = "2.4.10"
jvm = "17"

# Build tooling
agp = "9.2.1"

# Android SDK
android-compile-sdk = "37"
android-target-sdk = "36"
android-min-sdk = "24"

# Compose Multiplatform
compose-multiplatform = "1.12.0"

# AndroidX, for the fixture application modules only.
androidx-activity = "1.+"

# KotlinX
kotlinx-coroutines = "1.11.0"

# Dependency injection
metro = "1.4.2"

# Static analysis
detekt = "2.0.0-alpha.2"
dependency-analysis = "3.18.0"

# Testing (JVM-only: build-logic's own tests and the custom Detekt rules)
junit4 = "4.13.2"

[libraries]
# Gradle plugins resolved on the build-logic classpath
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
metro-gradle-plugin = { module = "dev.zacsweers.metro:gradle-plugin", version.ref = "metro" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }

# KotlinX
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# AndroidX (fixture application modules only)
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# Dependency injection
metro-runtime = { module = "dev.zacsweers.metro:runtime", version.ref = "metro" }

# Static analysis
dependency-analysis-gradle-plugin = { module = "com.autonomousapps:dependency-analysis-gradle-plugin", version.ref = "dependency-analysis" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
detekt-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }

# Testing
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
# Third-party
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }

# Conventions (build-logic)
buildkit-kmp-library = { id = "io.thernal.buildkit.kmp.library" }
buildkit-compose = { id = "io.thernal.buildkit.compose" }
buildkit-injection = { id = "io.thernal.buildkit.injection" }
buildkit-kotlin-library = { id = "io.thernal.buildkit.kotlin.library" }
buildkit-android-application = { id = "io.thernal.buildkit.android.application" }
buildkit-environment = { id = "io.thernal.buildkit.environment" }
buildkit-modules = { id = "io.thernal.buildkit.modules" }
buildkit-detekt = { id = "io.thernal.buildkit.detekt" }
