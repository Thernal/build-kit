# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC
kotlin.incremental=true
kotlin.incremental.multiplatform=true

# Kotlin Native
kotlin.incremental.native=true

# Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Application — read by build-logic; every key is documented in build-logic/README.md.
# Namespace prefix every module's Android namespace and every generated package derive from.
app.namespace=io.thernal.buildkit
# Environment flavors, in order. The one named by app.flavors.production is the release flavor:
# no application id suffix, release signing, no version name suffix.
app.flavors=regress,dev,beta,prod
app.flavors.production=prod
# The flavor a build uses when nothing else names one (see Flavors in build-logic/README.md).
app.flavors.default=dev
# Dependencies `api(...)` may still name, comma-separated: only modules exported into the iOS
# framework with `export(...)`, which Kotlin/Native accepts from `api` alone (e.g. :core:firebase).
app.api.allowed=:fixture:features:greeting:api
# Where modules live, for `create` and `graph`: the directory under the repository root ("" for the
# root itself) and the top-level areas in it. build-kit's own modules are its fixture.
app.modules.root=fixture
app.modules.areas=apps,core,features,shared,tools
