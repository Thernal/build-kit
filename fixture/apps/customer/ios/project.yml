# Customer's iOS side: the Xcode project's source; the .xcodeproj is generated and git-ignored
# (`make xcode-project APP=customer`, or scripts/xcode-project.sh customer: xcodegen with the app's version from
# ../version.properties in ${APP_VERSION_NAME} and ${APP_VERSION_CODE_<FLAVOR>}). It embeds the framework of
# ../shared, built by Gradle for the flavor Xcode's configuration names ("Beta Release" → beta).
name: customer
options:
  bundleIdPrefix: io.thernal.buildkit.fixture
  deploymentTarget:
    iOS: "17.0"
configs:
  Regress Debug: debug
  Regress Release: release
  Dev Debug: debug
  Dev Release: release
  Beta Debug: debug
  Beta Release: release
  Prod Debug: debug
  Prod Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  customer:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Customer
        UILaunchScreen: {}
        # The build settings below, which a release overrides (fastlane/Fastfile).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Compose Multiplatform checks this on the first frame; the app closes at launch without it.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      # Kotlin cannot tell the build type from a flavored configuration ("Dev Debug"): say it per type.
      # The id suffix per flavor is Android's applicationIdSuffix; production has none.
      configs:
        debug:
          KOTLIN_FRAMEWORK_BUILD_TYPE: debug
        release:
          KOTLIN_FRAMEWORK_BUILD_TYPE: release
        Regress Debug: &regress
          BUNDLE_ID_SUFFIX: .regress
          CURRENT_PROJECT_VERSION: ${APP_VERSION_CODE_REGRESS}
        Regress Release: *regress
        Dev Debug: &dev
          BUNDLE_ID_SUFFIX: .dev
          CURRENT_PROJECT_VERSION: ${APP_VERSION_CODE_DEV}
        Dev Release: *dev
        Beta Debug: &beta
          BUNDLE_ID_SUFFIX: .beta
          CURRENT_PROJECT_VERSION: ${APP_VERSION_CODE_BETA}
        Beta Release: *beta
        Prod Debug: &prod
          CURRENT_PROJECT_VERSION: ${APP_VERSION_CODE_PROD}
        Prod Release: *prod
      base:
        MARKETING_VERSION: ${APP_VERSION_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: io.thernal.buildkit.fixture.customer$(BUNDLE_ID_SUFFIX)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin builds iosSimulatorArm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "FixtureAppsCustomerShared"]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Without the version, the project was generated by plain xcodegen: version.properties never reached it.
          if [ -z "$MARKETING_VERSION" ] || [ -z "$CURRENT_PROJECT_VERSION" ]; then
            echo "error: no app version; generate the project with make xcode-project APP=customer" >&2
            exit 1
          fi
          cd "$SRCROOT/../../../.."
          ./gradlew :fixture:apps:customer:shared:embedAndSignAppleFrameworkForXcode
schemes:
  customer-Regress-Debug:
    build:
      targets:
        customer: all
    run:
      config: Regress Debug
    archive:
      config: Regress Debug
    profile:
      config: Regress Debug
    analyze:
      config: Regress Debug
  customer-Regress-Release:
    build:
      targets:
        customer: all
    run:
      config: Regress Release
    archive:
      config: Regress Release
    profile:
      config: Regress Release
    analyze:
      config: Regress Release
  customer-Dev-Debug:
    build:
      targets:
        customer: all
    run:
      config: Dev Debug
    archive:
      config: Dev Debug
    profile:
      config: Dev Debug
    analyze:
      config: Dev Debug
  customer-Dev-Release:
    build:
      targets:
        customer: all
    run:
      config: Dev Release
    archive:
      config: Dev Release
    profile:
      config: Dev Release
    analyze:
      config: Dev Release
  customer-Beta-Debug:
    build:
      targets:
        customer: all
    run:
      config: Beta Debug
    archive:
      config: Beta Debug
    profile:
      config: Beta Debug
    analyze:
      config: Beta Debug
  customer-Beta-Release:
    build:
      targets:
        customer: all
    run:
      config: Beta Release
    archive:
      config: Beta Release
    profile:
      config: Beta Release
    analyze:
      config: Beta Release
  customer-Prod-Debug:
    build:
      targets:
        customer: all
    run:
      config: Prod Debug
    archive:
      config: Prod Debug
    profile:
      config: Prod Debug
    analyze:
      config: Prod Debug
  customer-Prod-Release:
    build:
      targets:
        customer: all
    run:
      config: Prod Release
    archive:
      config: Prod Release
    profile:
      config: Prod Release
    analyze:
      config: Prod Release
